<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Store icon -->
  <g transform="translate(256, 256)">
    <!-- Roof -->
    <path d="M-140 -80 L0 -150 L140 -80 L140 -60 L-140 -60 Z" fill="url(#accent)"/>
    
    <!-- Building -->
    <rect x="-120" y="-60" width="240" height="180" fill="#2a2a3e" rx="10"/>
    
    <!-- Door -->
    <rect x="-30" y="40" width="60" height="80" fill="#00d4ff" rx="5"/>
    
    <!-- Windows -->
    <rect x="-100" y="-30" width="50" height="50" fill="#00d4ff" opacity="0.6" rx="5"/>
    <rect x="50" y="-30" width="50" height="50" fill="#00d4ff" opacity="0.6" rx="5"/>
    
    <!-- Sign -->
    <rect x="-80" y="-130" width="160" height="40" fill="#00d4ff" rx="5"/>
    <text x="0" y="-102" text-anchor="middle" fill="#0a0a0a" font-family="Arial, sans-serif" font-weight="bold" font-size="24">PAP</text>
  </g>
  
  <!-- Shopping cart -->
  <g transform="translate(380, 400)">
    <circle cx="10" cy="50" r="8" fill="#00d4ff"/>
    <circle cx="50" cy="50" r="8" fill="#00d4ff"/>
    <path d="M-20 0 L0 0 L10 35 L60 35 L70 10 L20 10" stroke="#00d4ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
